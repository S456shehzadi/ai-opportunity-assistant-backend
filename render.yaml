services:
  - type: web
    name: ai-opportunity-assistant-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        value: prod-secret-aiopportunityassistant-key-secure-2026-prod
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///app/data/app.db
      - key: AI_MODEL_PROVIDER
        value: mock
      - key: SEARCH_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: INFO
